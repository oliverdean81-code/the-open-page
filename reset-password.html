<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | The Open Page</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#344b3d;--cream:#f7f4ec;--ink:#30352f}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Georgia,serif}
header{background:var(--green);color:white;padding:24px 7%}main{max-width:620px;margin:55px auto;padding:0 20px}
.panel{background:white;border:1px solid #e2ddcf;border-radius:10px;padding:30px}
h1{color:var(--green);font-weight:normal}label{display:block;font:600 14px Arial,sans-serif;margin:15px 0 6px}
input{width:100%;padding:13px;border:1px solid #cfc9bc;border-radius:6px;font:16px Arial,sans-serif}
button{margin-top:20px;background:var(--green);color:white;border:0;border-radius:6px;padding:12px 19px;font:600 14px Arial,sans-serif;cursor:pointer}
.status{background:#f1eee6;padding:12px;border-radius:6px;margin-top:16px;font:14px Arial,sans-serif}
a{color:var(--green)}
</style>
</head>
<body>
<header><strong>THE OPEN PAGE · English Through Literature</strong></header>
<main><section class="panel">
<h1>Choose a new password</h1>
<p>Enter your new password below. Use at least 6 characters.</p>
<label for="password">New password</label><input id="password" type="password" autocomplete="new-password">
<label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" autocomplete="new-password">
<button id="savePassword">Save new password</button>
<div id="message" class="status" role="status">Open this page using the password reset link sent to your email.</div>
<p><a href="student.html">Return to sign in</a></p>
</section></main>
<script>
const PROJECT_URL='https://cqdtodyknixyhbcmgrxh.supabase.co';
const PUBLIC_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxZHRvZHlrbml4eWhiY21ncnhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUxOTY2MTMsImV4cCI6MjExMDc3MjYxM30.4MMJAMELPrA5idvZ4bP4ssYklWlmhAN_EarRAleVDcU';
const client=window.supabase.createClient(PROJECT_URL,PUBLIC_KEY);
document.getElementById('savePassword').addEventListener('click',async()=>{
 const password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value,msg=document.getElementById('message');
 if(password.length<6){msg.textContent='Please choose a password with at least 6 characters.';return}
 if(password!==confirm){msg.textContent='The passwords do not match. Please try again.';return}
 msg.textContent='Saving your new password…';
 const {error}=await client.auth.updateUser({password});
 if(error){msg.textContent='Could not update password: '+error.message;return}
 msg.textContent='Your password has been updated. You can now sign in with your new password.';
});
</script>
</body>
</html>
