
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson | The Open Page</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --green:#344B3D;
  --cream:#F7F4EC;
  --gold:#B39A68;
  --ink:#30352F;
}
* {box-sizing:border-box}
body {
  margin:0;
  font-family:Georgia,serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.7;
}
header {
  background:var(--green);
  color:var(--cream);
  padding:24px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.brand {font-size:23px;letter-spacing:2px}
.brand small {
  display:block;
  font-size:12px;
  letter-spacing:1px;
}
nav a {
  color:var(--cream);
  text-decoration:none;
  margin-left:18px;
}
main {
  max-width:900px;
  margin:auto;
  padding:45px 22px;
}
.back {color:var(--green);text-decoration:none}
h1,h2,h3 {color:var(--green)}
h1 {font-size:clamp(32px,5vw,46px);line-height:1.2}
.meta {color:#777;font-style:italic}
.panel {
  background:white;
  padding:26px;
  border-left:4px solid var(--gold);
  border-radius:5px;
  margin:24px 0;
}
.lesson-text {white-space:pre-wrap}
.video-link {
  display:inline-block;
  background:var(--green);
  color:white;
  padding:10px 18px;
  text-decoration:none;
  border-radius:3px;
}
.word {
  padding:12px 0;
  border-bottom:1px solid #e7e1d5;
}
.word strong {color:var(--green)}
.word p {margin:4px 0}
.activity {
  padding:16px 0;
  border-bottom:1px solid #e7e1d5;
}
.activity small {
  color:#777;
  text-transform:uppercase;
  letter-spacing:1px;
}
.answer-label {
  display:block;
  font-weight:bold;
  color:var(--green);
  margin:12px 0 6px;
}
.student-answer {
  display:block;
  width:100%;
  min-height:110px;
  padding:12px;
  border:1px solid #d8d1c4;
  border-radius:5px;
  font:inherit;
  resize:vertical;
}
.submit-answer {
  margin-top:10px;
  background:var(--green);
  color:white;
  border:0;
  border-radius:4px;
  padding:10px 18px;
  font:inherit;
  cursor:pointer;
}
.suggested-answer {
  margin-top:16px;
  padding:16px;
  background:var(--cream);
  border-left:3px solid var(--gold);
  border-radius:4px;
}
.suggested-answer h3 {margin:0 0 8px}
footer {
  background:var(--green);
  color:var(--cream);
  text-align:center;
  padding:28px;
  margin-top:40px;
}

/* Comfortable reading controls */
.reader-tools{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 18px;padding:12px;background:#f7f4ec;border:1px solid #e4dfd3;border-radius:6px}
.reader-tools span{font:600 13px Arial,sans-serif;color:var(--green);margin-right:4px}
.reader-tools button{min-width:42px;min-height:42px;padding:9px 13px;background:white;color:var(--green);border:1px solid #cfc5af;border-radius:4px;font:600 15px Arial,sans-serif;cursor:pointer}
.reader-tools button:focus-visible{outline:3px solid #8a7045;outline-offset:2px}
.reader-tools button[aria-pressed="true"]{background:var(--green);color:white}
.lesson-text{font-size:18px;line-height:1.85;max-width:72ch;overflow-wrap:anywhere}
.lesson-text.relaxed{line-height:2.05}
@media(max-width:700px){header{padding:18px 16px;flex-direction:column;text-align:center}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}nav a{margin:0;padding:7px 9px}main{padding:28px 14px}.panel{padding:18px;margin:18px 0}.lesson-text{font-size:18px;line-height:1.8}.reader-tools{gap:7px}.reader-tools button{flex:1 1 auto}}

/* Focus reading, responsive video and lesson navigation */
.lesson-jump{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 24px;padding:12px;background:#fffdf8;border:1px solid #e4dfd3;border-radius:6px}
.lesson-jump a{color:var(--green);font:600 14px Arial,sans-serif;text-decoration:none;padding:8px 10px;border-radius:4px;background:var(--cream)}
.video-frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#17231c}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.focus-toggle{margin-left:auto}
body.focus-reading header,body.focus-reading footer,body.focus-reading #backLink,body.focus-reading #lesson>*:not(.reading-panel){display:none!important}
body.focus-reading main{max-width:900px;padding-top:28px}
body.focus-reading .reading-panel{margin-top:0;min-height:75vh}
@media(max-width:700px){.lesson-jump{position:static;gap:6px}.lesson-jump a{flex:1 1 auto;text-align:center}.focus-toggle{margin-left:0}.video-frame{border-radius:4px}}
</style>
</head>

<body>

<header>
  <div class="brand">
    THE OPEN PAGE
    <small>English Through Literature</small>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="news.html">News</a>
    <a href="stories.html">Short Stories</a>
    <a href="poetry.html">Poetry</a>
  </nav>
</header>

<main>
  <a class="back" id="backLink" href="index.html">← Back to lessons</a>
  <div id="lesson"><p>Loading lesson…</p></div>
</main>

<footer>
  <strong>THE OPEN PAGE</strong><br>
  Read. Discover. Think. Express.
</footer>

<script>

function formatActivityType(s) {
  return String(s||'')
    .replace(/-/g,' ')
    .replace(/\b\w/g,ch=>ch.toUpperCase());
}

const client = window.supabase.createClient(
  'https://cqdtodyknixyhbcmgrxh.supabase.co',
  'sb_publishable_arlnZNY8-D3A-bVZ8Qx04w_3PtFlEX3'
);

const root = document.getElementById('lesson');

function el(tag,text,cls) {
  const x = document.createElement(tag);
  x.textContent = text || '';
  if(cls) x.className = cls;
  return x;
}

function panel(title) {
  const p = document.createElement('section');
  p.className = 'panel';
  p.appendChild(el('h2',title));
  return p;
}

async function load() {

  const params = new URLSearchParams(location.search);
  const lessonId = params.get('id');
  const slug = params.get('slug');

  if(!lessonId && !slug) {
    root.replaceChildren(el('p','No lesson was selected. Please return to the lessons page.'));
    return;
  }

  try {

    const preview = new URLSearchParams(location.search).get('preview') === '1';

    if(preview) {
      const {data:{session},error:sessionError} =
        await client.auth.getSession();

      if(sessionError || !session)
        throw new Error('Please sign in as a teacher to preview this lesson.');

      const {data:isTeacher,error:roleError} =
        await client.rpc('is_teacher');

      if(roleError || isTeacher !== true)
        throw new Error('Teacher access is required to preview unpublished lessons.');
    }

    let lessonQuery = client.from('lessons')
      .select('id,title,slug,summary,area_id,level_id,status');

    if(lessonId)
      lessonQuery = lessonQuery.eq('id',lessonId);
    else
      lessonQuery = lessonQuery.eq('slug',slug);

    if(!preview)
      lessonQuery = lessonQuery.eq('status','published');

    const {data:lesson,error} = await lessonQuery.single();

    if(error) throw error;

    const {data:privateRows,error:privateError} =
      await client.rpc('get_lesson_private_content',{
        p_lesson_id:lesson.id
      });

    if(privateError)
      throw new Error('This lesson requires an active membership. Please sign in and check your membership, then try again.');

    const privateData = Array.isArray(privateRows)
      ? privateRows[0]
      : privateRows;

    const [
      {data:areas,error:ae},
      {data:levels,error:le}
    ] = await Promise.all([
      client.from('learning_areas').select('id,name,slug'),
      client.from('levels').select('id,name,code')
    ]);

    if(ae) throw ae;
    if(le) throw le;

    const area = areas.find(
      x => String(x.id) === String(lesson.area_id)
    );

    const level = levels.find(
      x => String(x.id) === String(lesson.level_id)
    );

    document.title = lesson.title + ' | The Open Page';

    document.getElementById('backLink').href =
      area?.slug === 'news' ? 'news.html' :
      area?.slug === 'short-stories' ? 'stories.html' :
      area?.slug === 'poetry' ? 'poetry.html' :
      'index.html';

    root.replaceChildren();

    root.appendChild(el(
      'p',
      (area?.name || '') + ' · ' + (level?.code || ''),
      'meta'
    ));

    root.appendChild(el('h1',lesson.title));

    if(lesson.summary)
      root.appendChild(el('p',lesson.summary,'meta'));

    // VIDEO LESSON

    if(privateData?.video_url) {
      let lessonVideos=[];
      const stored=String(privateData.video_url).trim();
      if(stored.startsWith('[')){
        try{const parsed=JSON.parse(stored);if(Array.isArray(parsed))lessonVideos=parsed.filter(v=>typeof v==='string')}catch(e){}
      }else lessonVideos=[stored];
      lessonVideos=lessonVideos.filter(v=>/^https?:\\/\\//i.test(v.trim()));
      if(lessonVideos.length){
      const p = panel(lessonVideos.length>1?'Lesson videos':'Video lesson');
      lessonVideos.forEach((videoUrl,index)=>{
      const rawVideoUrl=videoUrl.trim();
      let videoEmbed=null;
      try {
        const parsed=new URL(rawVideoUrl);
        const host=parsed.hostname.replace(/^www\./,'');
        let embedUrl=null;
        if(host==='youtu.be') embedUrl='https://www.youtube-nocookie.com/embed/'+parsed.pathname.slice(1).split('/')[0];
        if(host==='youtube.com'||host==='m.youtube.com'||host==='youtube-nocookie.com') {
          const id=parsed.searchParams.get('v')||parsed.pathname.match(/\/(?:embed|shorts)\/([^/?]+)/)?.[1];
          if(id) embedUrl='https://www.youtube-nocookie.com/embed/'+id;
        }
        if(host==='vimeo.com'||host==='player.vimeo.com') {
          const id=parsed.pathname.match(/\/(?:video\/)?(\d+)/)?.[1];
          if(id) embedUrl='https://player.vimeo.com/video/'+id;
        }
        if(embedUrl) videoEmbed=embedUrl;
      } catch(e) {}
      if(videoEmbed) {
        const frame=el('div','','video-frame');
        const iframe=document.createElement('iframe');
        iframe.src=videoEmbed;
        iframe.title='Lesson video '+(index+1);
        iframe.loading='lazy';
        iframe.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
        iframe.allowFullscreen=true;
        frame.appendChild(iframe);
        p.appendChild(frame);
      }
      const a=el('a',videoEmbed?'Open video in a new tab':'Watch video','video-link');
      a.href=rawVideoUrl;a.target='_blank';a.rel='noopener noreferrer';
      if(lessonVideos.length>1){const heading=el('p','Video '+(index+1),'meta');p.insertBefore(heading,videoEmbed?frame:a)}
      p.appendChild(a);
      });
      p.id='video-section';
      root.appendChild(p);
      }
    }

    // READING

    if(privateData?.lesson_content) {
      const p = panel('Reading');
      p.classList.add('reading-panel');
      p.id='reading-section';

      const readerTools = el('div','','reader-tools');
      readerTools.setAttribute('aria-label','Reading display settings');
      const toolsLabel = el('span','Reading settings');
      readerTools.appendChild(toolsLabel);
      const smaller = el('button','A−');
      smaller.type='button'; smaller.setAttribute('aria-label','Decrease reading text size');
      const reset = el('button','Reset');
      reset.type='button'; reset.setAttribute('aria-label','Reset reading text size');
      const larger = el('button','A+');
      larger.type='button'; larger.setAttribute('aria-label','Increase reading text size');
      const spacing = el('button','Relaxed spacing');
      const focus = el('button','Focus reading');
      focus.type='button';focus.className='focus-toggle';focus.setAttribute('aria-pressed','false');
      spacing.type='button'; spacing.setAttribute('aria-pressed','false');
      readerTools.append(smaller,reset,larger,spacing,focus);
      focus.addEventListener('click',()=>{const active=document.body.classList.toggle('focus-reading');focus.setAttribute('aria-pressed',String(active));focus.textContent=active?'Exit focus mode':'Focus reading';if(active)window.scrollTo({top:0,behavior:'smooth'});});

      const readingText = el('div',privateData.lesson_content,'lesson-text');
      let readingSize=18;
      function updateReadingSize(){readingText.style.fontSize=readingSize+'px';}
      smaller.addEventListener('click',()=>{readingSize=Math.max(15,readingSize-1);updateReadingSize()});
      larger.addEventListener('click',()=>{readingSize=Math.min(26,readingSize+1);updateReadingSize()});
      reset.addEventListener('click',()=>{readingSize=18;updateReadingSize();readingText.classList.remove('relaxed');spacing.setAttribute('aria-pressed','false');spacing.textContent='Relaxed spacing'});
      spacing.addEventListener('click',()=>{const active=readingText.classList.toggle('relaxed');spacing.setAttribute('aria-pressed',String(active));spacing.textContent=active?'Standard spacing':'Relaxed spacing'});

      p.appendChild(readerTools);
      p.appendChild(readingText);
      root.appendChild(p);
    }

    // VOCABULARY

    const {data:vocab,error:ve} = await client
      .from('vocabulary')
      .select('word,definition,example')
      .eq('lesson_id',lesson.id)
      .order('word',{ascending:true});

    if(ve) throw ve;

    if(vocab && vocab.length) {

      const p = panel('Vocabulary');
      p.id='vocabulary-section';

      vocab.forEach(item => {

        const entry = el('div','','word');

        entry.appendChild(el('strong',item.word));

        if(item.definition) {
          entry.appendChild(el('p',item.definition));
        }

        if(item.example) {
          entry.appendChild(el(
            'p',
            'Example: ' + item.example
          ));
        }

        p.appendChild(entry);

      });

      root.appendChild(p);

    }

    // ACTIVITIES

    const {data:acts,error:ae2} = await client
      .from('activities')
      .select('id,activity_type,prompt,suggested_answer')
      .eq('lesson_id',lesson.id)
      .order('sort_order');

    if(ae2) throw ae2;

    if(acts?.length) {

      const p = panel('Activities');
      p.id='activities-section';

      acts.forEach(async (a,index) => {

        const d = el('div','','activity');

        d.appendChild(el(
          'small',
          formatActivityType(a.activity_type)
        ));

        d.appendChild(el('p',a.prompt));

        const form = document.createElement('form');

        const {data:{session:studentSession}} = await client.auth.getSession();
        let savedResponse = null;
        if(studentSession) {
          const {data:existingResponse,error:responseLoadError} = await client
            .from('student_activity_responses')
            .select('answer,submitted_at,feedback,feedback_at')
            .eq('activity_id',a.id)
            .eq('user_id',studentSession.user.id)
            .maybeSingle();
          if(responseLoadError) console.warn('Could not load saved answer:',responseLoadError.message);
          savedResponse = existingResponse;
        }

        form.addEventListener('submit',async event => {
          event.preventDefault();

          const {data:{session},error:sessionError} = await client.auth.getSession();
          if(sessionError || !session) {
            let notice = d.querySelector('.answer-status');
            if(!notice) { notice=el('p','','answer-status'); form.appendChild(notice); }
            notice.textContent='Please sign in to your student account before submitting an answer. ';
            const signInLink=el('a','Sign in here');
            signInLink.href='student.html';
            notice.appendChild(signInLink);
            return;
          }

          const answerText=textarea.value.trim();
          if(!answerText) {
            textarea.focus();
            return;
          }

          button.disabled=true;
          button.textContent='Saving…';
          let notice = d.querySelector('.answer-status');
          if(!notice) { notice=el('p','','answer-status'); form.appendChild(notice); }
          notice.textContent='Saving your answer…';

          const {error:saveError}=await client
            .from('student_activity_responses')
            .upsert({
              user_id:session.user.id,
              activity_id:a.id,
              answer:answerText,
              submitted_at:new Date().toISOString()
            },{onConflict:'user_id,activity_id'});

          button.disabled=false;
          button.textContent='Save answer';

          if(saveError) {
            notice.textContent='Your answer could not be saved: '+saveError.message;
            return;
          }

          notice.textContent='Your answer has been saved successfully.';
          savedResponse={answer:answerText,submitted_at:new Date().toISOString()};

          let result = d.querySelector('.suggested-answer');
          if(!result) {
            result = el('div','','suggested-answer');
            result.appendChild(el('h3','Suggested answer'));
            result.appendChild(el(
              'p',
              a.suggested_answer ||
              'No suggested answer has been provided for this activity.'
            ));
            d.appendChild(result);
          }
        });

        const label = el(
          'label',
          'Write your answer:',
          'answer-label'
        );

        label.htmlFor = 'student-answer-' + index;

        const textarea = el(
          'textarea',
          '',
          'student-answer'
        );

        textarea.id = 'student-answer-' + index;
        textarea.placeholder = 'Type your answer here…';
        textarea.required = true;
        if(savedResponse?.answer) textarea.value=savedResponse.answer;

        if(savedResponse?.feedback) {
          const feedbackBox=el('div','','suggested-answer');
          feedbackBox.appendChild(el('h3','Feedback from your teacher'));
          feedbackBox.appendChild(el('p',savedResponse.feedback));
          if(savedResponse.feedback_at) feedbackBox.appendChild(el('small','Feedback received: '+new Date(savedResponse.feedback_at).toLocaleDateString()));
          d.appendChild(feedbackBox);
        }

        const button = el(
          'button',
          'Save answer',
          'submit-answer'
        );

        button.type = 'submit';

        form.append(label,textarea,button);
        d.appendChild(form);
        p.appendChild(d);

      });

      root.appendChild(p);
    }

    const jumpItems=[['video-section','Video'],['reading-section','Reading'],['vocabulary-section','Vocabulary'],['activities-section','Activities']].filter(([id])=>document.getElementById(id));
    if(jumpItems.length>1) {
      const jump=el('nav','','lesson-jump');
      jump.setAttribute('aria-label','Jump to lesson section');
      jumpItems.forEach(([id,label])=>{const link=el('a',label);link.href='#'+id;jump.appendChild(link)});
      root.insertBefore(jump,root.firstChild);
    }

  } catch(e) {

    root.replaceChildren(
      el('p','This lesson could not be loaded: ' + e.message)
    );

  }
}

load();

</script>

</body>
</html>
