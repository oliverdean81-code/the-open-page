<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lesson | The Open Page</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#344B3D;--cream:#F7F4EC;--gold:#B39A68;--ink:#30352F}*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:var(--cream);color:var(--ink);line-height:1.7}header{background:var(--green);color:var(--cream);padding:24px 8%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:23px;letter-spacing:2px}.brand small{display:block;font-size:12px;letter-spacing:1px}nav a{color:var(--cream);text-decoration:none;margin-left:18px}main{max-width:900px;margin:auto;padding:45px 22px}.back{color:var(--green);text-decoration:none}h1,h2,h3{color:var(--green)}h1{font-size:clamp(32px,5vw,46px);line-height:1.2}.meta{color:#777;font-style:italic}.panel{background:white;padding:26px;border-left:4px solid var(--gold);border-radius:5px;margin:24px 0}.lesson-text{white-space:pre-wrap}.video-link{display:inline-block;background:var(--green);color:white;padding:10px 18px;text-decoration:none;border-radius:3px}.word{padding:12px 0;border-bottom:1px solid #e7e1d5}.word strong{color:var(--green)}.activity{padding:16px 0;border-bottom:1px solid #e7e1d5}.activity small{color:#777;text-transform:uppercase;letter-spacing:1px}footer{background:var(--green);color:var(--cream);text-align:center;padding:28px;margin-top:40px}
</style></head><body>
<header><div class="brand">THE OPEN PAGE<small>English Through Literature</small></div><nav><a href="index.html">Home</a><a href="news.html">News</a><a href="stories.html">Short Stories</a><a href="poetry.html">Poetry</a></nav></header>
<main><a class="back" id="backLink" href="index.html">← Back to lessons</a><div id="lesson"><p>Loading lesson…</p></div></main><footer><strong>THE OPEN PAGE</strong><br>Read. Discover. Think. Express.</footer>
<script>
const client=window.supabase.createClient('https://cqdtodyknixyhbcmgrxh.supabase.co','sb_publishable_arlnZNY8-D3A-bVZ8Qx04w_3PtFlEX3'),root=document.getElementById('lesson');
function el(tag,text,cls){const x=document.createElement(tag);x.textContent=text||'';if(cls)x.className=cls;return x}
function panel(title){const p=document.createElement('section');p.className='panel';p.appendChild(el('h2',title));return p}
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){root.replaceChildren(el('p','No lesson was selected. Please return to the lessons page.'));return}
try{
const {data:lesson,error}=await client.from('lessons').select('id,title,slug,summary,lesson_content,video_url,area_id,level_id,status').eq('slug',slug).eq('status','published').single();if(error)throw error;
const [{data:areas,error:ae},{data:levels,error:le}]=await Promise.all([client.from('learning_areas').select('id,name,slug'),client.from('levels').select('id,name,code')]);if(ae)throw ae;if(le)throw le;
const area=areas.find(x=>String(x.id)===String(lesson.area_id)),level=levels.find(x=>String(x.id)===String(lesson.level_id));document.title=lesson.title+' | The Open Page';document.getElementById('backLink').href=area?.slug==='news'?'news.html':area?.slug==='short-stories'?'stories.html':area?.slug==='poetry'?'poetry.html':'index.html';root.replaceChildren();
root.appendChild(el('p',(area?.name||'')+' · '+(level?.code||''),'meta'));root.appendChild(el('h1',lesson.title));if(lesson.summary)root.appendChild(el('p',lesson.summary,'meta'));
if(lesson.video_url){const p=panel('Video lesson'),a=el('a','Watch video','video-link');a.href=lesson.video_url;a.target='_blank';a.rel='noopener noreferrer';p.appendChild(a);root.appendChild(p)}
if(lesson.lesson_content){const p=panel('Reading');p.appendChild(el('div',lesson.lesson_content,'lesson-text'));root.appendChild(p)}
const {data:vocab,error:ve}=await client.from('vocabulary').select('word,definition,example').eq('lesson_id',lesson.id).order('sort_order');if(ve)throw ve;if(vocab?.length){const p=panel('Vocabulary');vocab.forEach(v=>{const d=el('div','','word');d.appendChild(el('strong',v.word));d.appendChild(el('div',v.definition));if(v.example)d.appendChild(el('em',v.example));p.appendChild(d)});root.appendChild(p)}
const {data:acts,error:ae2}=await client.from('activities').select('activity_type,prompt,suggested_answer').eq('lesson_id',lesson.id).order('sort_order');if(ae2)throw ae2;if(acts?.length){const p=panel('Activities');acts.forEach(a=>{const d=el('div','','activity');d.appendChild(el('small',a.activity_type));d.appendChild(el('p',a.prompt));if(a.suggested_answer){const details=el('details',''),summary=el('summary','Suggested answer');details.appendChild(summary);details.appendChild(el('p',a.suggested_answer));d.appendChild(details)}p.appendChild(d)});root.appendChild(p)}
}catch(e){root.replaceChildren(el('p','This lesson could not be loaded: '+e.message))}}
load();
</script></body></html>
